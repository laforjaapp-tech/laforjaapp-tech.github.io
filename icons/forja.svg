<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondo" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#7a2a08"/><stop offset=".35" stop-color="#2a1007"/><stop offset="1" stop-color="#09090b"/></radialGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset=".45" stop-color="#8994a0"/><stop offset="1" stop-color="#2a3037"/></linearGradient>
    <linearGradient id="disco" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4047"/><stop offset=".35" stop-color="#1c2024"/><stop offset="1" stop-color="#0e1013"/></linearGradient>
    <linearGradient id="fuego" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff6a13"/><stop offset="1" stop-color="#e2240f"/></linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2f12"/><stop offset=".45" stop-color="#c07c3e"/><stop offset="1" stop-color="#4a250d"/></linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <circle cx="256" cy="200" r="120" fill="#ff6a13" opacity=".4" filter="url(#brillo)"/>
  <!-- martillo de herrero (diagonal /): mango de madera y cabeza de acero -->
  <g transform="rotate(-45 256 196)">
    <rect x="96" y="186" width="250" height="20" rx="10" fill="url(#mango)"/>
    <path d="M338 142 H404 L414 156 V236 L404 250 H338 Z" fill="url(#acero)"/>
    <rect x="338" y="142" width="12" height="108" fill="#fff" opacity=".45"/>
  </g>
  <!-- mancuerna (diagonal \): barra y discos de goma con borde naranja -->
  <g transform="rotate(45 256 196)">
    <rect x="150" y="186" width="212" height="20" rx="6" fill="url(#acero)"/>
    <rect x="118" y="132" width="36" height="128" rx="10" fill="url(#disco)" stroke="#ff7a1a" stroke-width="4"/>
    <rect x="88" y="152" width="30" height="88" rx="9" fill="url(#disco)" stroke="#ff7a1a" stroke-width="4"/>
    <rect x="358" y="132" width="36" height="128" rx="10" fill="url(#disco)" stroke="#ff7a1a" stroke-width="4"/>
    <rect x="394" y="152" width="30" height="88" rx="9" fill="url(#disco)" stroke="#ff7a1a" stroke-width="4"/>
  </g>
  <!-- yunque de fuego -->
  <path d="M96 352 C120 340 146 336 170 335 L420 335 L420 372 L392 372 C372 380 362 394 360 408 L398 422 L398 444 L150 444 L150 422 L188 408 C186 394 176 382 160 376 C134 374 114 368 96 352 Z" fill="url(#fuego)"/>
  <path d="M118 344 C138 338 154 336 170 336 L420 336" fill="none" stroke="#fff2c4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
